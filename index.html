<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destie Shop</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Style de base pour éviter le décalage */
    body {
      margin: 0;
      padding: 0;
      background-color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
  </style>
</head>
<body>

  <!-- EN-TÊTE -->
  <header style="display:flex; justify-content:space-between; align-items:center; padding:1rem; background:#1f2937; color:white; position:sticky; top:0; z-index:100;">
    <h2 style="margin:0; font-size:1.2rem; color:#f59e0b;">Destie Shop</h2>
    <div id="header-actions"></div>
  </header>

  <!-- CONTENU PRINCIPAL -->
  <main id="app-content" style="padding-bottom: 80px;"></main>

  <!-- NAVIGATION DU BAS (4 ONGLETS) -->
  <nav class="bottom-nav" style="position:fixed; bottom:0; left:0; right:0; background:#1f2937; display:flex; justify-content:space-around; padding:0.6rem 0; border-top:1px solid #374151; z-index:1000;">
    <button class="nav-item active" onclick="switchView('catalog')" style="background:none; border:none; color:white; font-size:0.75rem; display:flex; flex-direction:column; align-items:center; cursor:pointer;">
      <i class="fa-solid fa-store" style="font-size:1.2rem; margin-bottom:2px;"></i> Boutique
    </button>
    <button class="nav-item" onclick="switchView('reservations')" style="background:none; border:none; color:white; font-size:0.75rem; display:flex; flex-direction:column; align-items:center; cursor:pointer;">
      <i class="fa-solid fa-bookmark" style="font-size:1.2rem; margin-bottom:2px;"></i> Réservations
    </button>
    <button class="nav-item" onclick="switchView('purchases')" style="background:none; border:none; color:white; font-size:0.75rem; display:flex; flex-direction:column; align-items:center; cursor:pointer;">
      <i class="fa-solid fa-bag-shopping" style="font-size:1.2rem; margin-bottom:2px;"></i> Mes Achats
    </button>
    <button class="nav-item" onclick="switchView('profile')" style="background:none; border:none; color:white; font-size:0.75rem; display:flex; flex-direction:column; align-items:center; cursor:pointer;">
      <i class="fa-solid fa-user" style="font-size:1.2rem; margin-bottom:2px;"></i> Profil
    </button>
  </nav>

  <!-- SDK FIREBASE (Compatibilité v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <!-- FICHIER LOGIQUE JS (Appelé à la racine) -->
  <script src="app.js"></script>
</body>
</html>
